<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>Limestone City Bitcoin</title>
  <defs>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.4" fill="#8A8476"/>
    </pattern>
  </defs>
  <rect width="360" height="360" fill="#F2EFE8"/>
  <!-- the coin -->
  <circle cx="236" cy="124" r="62" fill="#C7A04C" fill-opacity="0.95"/>
  <!-- the limestone block -->
  <g filter="url(#edge)">
    <polygon points="82,132 238,124 246,262 88,270" fill="#CFC9BD"/>
    <polygon points="82,132 238,124 246,262 88,270" fill="url(#dots)" fill-opacity="0.6"/>
  </g>
  <!-- the red hairline -->
  <line x1="88" y1="292" x2="246" y2="292" stroke="#A23A2A" stroke-width="1.4"/>
</svg>
