<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description }}">
    <meta name="keywords" content="{{ page.keywords }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.og_description }}">
    <meta property="og:type" content="{{ page.og_type }}">
    <meta property="og:site_name" content="Limestone City Bitcoin">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.og_image | default: '/assets/images/og-image.jpg' | absolute_url }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:image:alt" content="Limestone City Bitcoin">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.og_description }}">
    <meta name="twitter:image" content="{{ page.og_image | default: '/assets/images/og-image.jpg' | absolute_url }}">
    <link rel="icon" type="image/png" href="./assets/images/logo.png">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="header-status">
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <div class="header-center">
            <div class="header-stat">
                <div class="label">Current Block Height</div>
                <p id="block-height" class="height">-------</p>
            </div>
            <div class="header-divider"></div>
            <div class="header-stat" title="Satoshis per US dollar. Watch the rate in sats, not fiat price">
                <div class="label">Moscow Time</div>
                <p id="moscow-time" class="height">--:--</p>
            </div>
            <div class="header-divider"></div>
            <a href="https://canadiandebtclock.com" target="_blank" class="header-stat header-stat-link" title="Canada's national debt, live">
                <div class="label">Canadian Debt</div>
                <p class="height">Live ↗</p>
            </a>
        </div>

        <nav class="nav-menu" id="nav-menu">
            <a href="index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item">About</a>
            <a href="learn.html" class="nav-item">Learn</a>
            <a href="40hpw.html" class="nav-item">#40HPW</a>
            <a href="pioneers.html" class="nav-item">Pioneers</a>

            <details class="nav-dropdown">
                <summary>Block Bits</summary>
                <div class="dropdown-content">
                    <a href="long-view-index.html">The Long View Series</a>
                    <a href="block-bits-owen.html">Owen's First Year</a>
                </div>
            </details>

            <a href="meetups.html" class="nav-item">Meetups</a>
            <a href="contact.html" class="nav-item">Contact</a>
        </nav>
    </header>

{{ content }}

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-row">
                <div class="footer-text">
                    <p>No copyright on this site. No rights reserved. Content hosted or linked here may have copyright of its own.</p>
                </div>
                <div class="footer-icons">
                    <a href="https://signal.group/#CjQKIN65dM3kLRkn1UcJwmxcDUcBEww4IGvL1FFIGee557yaEhAs_fvpE6t8Fa9Yn_PncDi8" target="_blank" aria-label="Signal Group">
                        <img src="./assets/images/signal.svg" alt="Signal">
                    </a>
                    <a href="https://github.com/23BeatsOff/limestone-city-bitcoin" target="_blank" aria-label="GitHub Repository">
                        <img src="./assets/images/github.svg" alt="GitHub">
                    </a>
                    <a href="https://njump.me/npub17exm4s7zmaxuyeljm0w22gfuhqlf82zedqjf3eaxk55m7tv3ug9see3cl4" target="_blank" aria-label="Nostr Profile">
                        <img src="./assets/images/nostr.svg" alt="Nostr">
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="./js/script.js"></script>

</html>
